<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot - MediVerse</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="chat.css" />
</head>

<body>
    <button id="chatbot-toggler">
      <span class="material-symbols-rounded toggler-icon">mode_comment</span>
      <span class="material-symbols-rounded close-icon">close</span>
    </button>

    <div class="chatbot-popup">
      <div class="chat-header">
        <div class="header-info">
          
          <h2 class="logo-text">HealthBot</h2>
        </div>
        <button id="close-chatbot" class="material-symbols-rounded">keyboard_arrow_down</button>
      </div>

      <div class="chat-body">
        <div class="message bot-message initial-message">
          <div class="bot-avatar">
            <img src="chatbot_img.png" alt="Bot Avatar">
          </div>

          <div class="message-text">
            <p>Hello! I'm MediVerse HealthBot, your personalized AI assistant. How can I help you today? ✨</p>
          </div>
        </div>
      </div>

      <div class="chat-footer">
        <form action="#" class="chat-form">
          <textarea placeholder="Ask me anything..." class="message-input" required></textarea>
          <div class="chat-controls">
            <button type="button" id="emoji-picker" class="material-symbols-rounded control-btn">mood</button>
            <div class="file-upload-wrapper">
              <input type="file" accept="image/*, application/pdf" id="file-input" hidden>
              <button type="button" id="file-upload" class="material-symbols-rounded control-btn">attach_file</button>
            </div>
            <button type="submit" id="send-message" class="material-symbols-rounded send-btn">send</button>
          </div>
        </form>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
  <script src="chat.js"></script>
</body>

</html>
